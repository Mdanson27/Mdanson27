<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030810"/>
    <stop offset="52%" stop-color="#0A2949"/>
    <stop offset="100%" stop-color="#07111D"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1687FF"/>
    <stop offset="55%" stop-color="#67C9FF"/>
    <stop offset="100%" stop-color="#FF7A00"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0%" stop-color="#1687FF" stop-opacity=".28"/>
    <stop offset="100%" stop-color="#1687FF" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .txt{font-family:Arial,Segoe UI,sans-serif}
    .mono{font-family:Consolas,Menlo,monospace}
    .grid{stroke:#83C7F7;opacity:.06}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .pulse2{animation:pulse 2.8s ease-in-out 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:.22}50%{opacity:1}}
    .flow{stroke-dasharray:12 16;animation:flow 8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-112}}
    .scan{animation:scan 7s ease-in-out infinite}
    @keyframes scan{0%,100%{transform:translateX(-10px);opacity:.15}50%{transform:translateX(130px);opacity:.6}}
  </style>
</defs>

<rect width="1400" height="500" rx="38" fill="url(#bg)"/>
<circle cx="1140" cy="210" r="330" fill="url(#halo)"/>

<g class="grid">
  <path d="M0 70H1400M0 140H1400M0 210H1400M0 280H1400M0 350H1400M0 420H1400"/>
  <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500M800 0V500M900 0V500M1000 0V500M1100 0V500M1200 0V500M1300 0V500"/>
</g>

<!-- left identity -->
<text x="76" y="76" class="mono" fill="#6BC5FF" font-size="18" letter-spacing="3">DANSON // SYSTEMS BUILDER</text>
<text x="74" y="170" class="txt" fill="#FFFFFF" font-size="70" font-weight="800" letter-spacing="1">MUSHABE DANSON</text>
<rect x="76" y="202" width="266" height="6" rx="3" fill="url(#accent)"/>
<text x="76" y="257" class="txt" fill="#DCEEFF" font-size="29" font-weight="700">AI • AUTOMATION • BUSINESS SYSTEMS</text>
<text x="76" y="305" class="txt" fill="#9CB9D2" font-size="21">Founder, AutoMinds Africa — building intelligent systems that remove friction from real work.</text>

<g transform="translate(76 360)">
  <rect width="282" height="46" rx="23" fill="#0B2136" stroke="#245577"/>
  <circle cx="23" cy="23" r="6" fill="#48E48D" class="pulse"/>
  <text x="41" y="29" class="mono" fill="#DDF1FF" font-size="15">SYSTEM STATUS // BUILDING</text>
</g>

<g transform="translate(374 360)">
  <rect width="200" height="46" rx="23" fill="#0B2136" stroke="#245577"/>
  <text x="23" y="29" class="mono" fill="#A9CAE2" font-size="15">KAMPALA // UGANDA</text>
</g>

<text x="76" y="454" class="mono" fill="#6488A3" font-size="15">WORK SMARTER. NOT HARDER.</text>

<!-- right neural monogram -->
<g transform="translate(865 68)">
  <circle cx="220" cy="180" r="156" fill="#081C30" stroke="#183D5B"/>
  <circle cx="220" cy="180" r="118" fill="none" stroke="#1A527B" opacity=".45"/>
  <circle cx="220" cy="180" r="82" fill="none" stroke="#1A527B" opacity=".25"/>

  <path class="flow" d="M84 184 C124 106 180 72 245 90 S356 151 345 215 280 304 195 289 83 251 84 184Z" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <path class="flow" d="M112 118 C183 166 251 113 317 165 S304 271 229 273 111 225 112 118Z" fill="none" stroke="#4DB7FF" stroke-width="2" opacity=".48"/>

  <g fill="#1687FF" filter="url(#glow)">
    <circle cx="102" cy="174" r="7" class="pulse"/>
    <circle cx="184" cy="94" r="7" class="pulse2"/>
    <circle cx="303" cy="132" r="7" class="pulse"/>
    <circle cx="330" cy="232" r="7" class="pulse2"/>
    <circle cx="226" cy="289" r="7" class="pulse"/>
  </g>
  <circle cx="276" cy="250" r="8" fill="#FF7A00" class="pulse2" filter="url(#glow)"/>

  <!-- stylized D -->
  <path d="M173 124 V240 H218 C268 240 295 218 295 182 C295 146 268 124 218 124 Z" fill="none" stroke="#E9F7FF" stroke-width="13" stroke-linejoin="round"/>
  <path d="M194 146 V218 H220 C251 218 271 205 271 182 C271 159 251 146 220 146 Z" fill="#0B2945" stroke="#67C9FF" stroke-width="3"/>

  <rect x="136" y="331" width="168" height="32" rx="16" fill="#0C2238" stroke="#244D6B"/>
  <text x="158" y="352" class="mono" fill="#9CC7E5" font-size="13">FOUNDER // AUTOMINDS</text>
</g>

<g class="scan">
  <rect x="1190" y="70" width="2" height="330" fill="#6BC5FF"/>
</g>
</svg>