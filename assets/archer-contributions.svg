<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050B14"/>
    <stop offset="52%" stop-color="#0A2746"/>
    <stop offset="100%" stop-color="#06111D"/>
  </linearGradient>
  <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1B8CFF"/>
    <stop offset="52%" stop-color="#6BC8FF"/>
    <stop offset="100%" stop-color="#FF7A00"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0%" stop-color="#1687FF" stop-opacity=".26"/>
    <stop offset="100%" stop-color="#1687FF" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .txt{font-family:Arial,Segoe UI,sans-serif}
    .mono{font-family:Consolas,Menlo,monospace}
    .grid{stroke:#78BDF0;stroke-width:1;opacity:.075}
    .trace{fill:none;stroke:url(#energy);stroke-width:3;stroke-linecap:round;stroke-dasharray:680;stroke-dashoffset:680;opacity:0}
    .shot1{animation:shot1 18s infinite}.shot2{animation:shot2 18s infinite}.shot3{animation:shot3 18s infinite}.shot4{animation:shot4 18s infinite}
    .shot5{animation:shot5 18s infinite}.shot6{animation:shot6 18s infinite}.shot7{animation:shot7 18s infinite}.shot8{animation:shot8 18s infinite}
    @keyframes shot1{0%,3%{opacity:0;stroke-dashoffset:680}4%{opacity:1}8%{opacity:1;stroke-dashoffset:0}9%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes shot2{0%,11%{opacity:0;stroke-dashoffset:680}12%{opacity:1}16%{opacity:1;stroke-dashoffset:0}17%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes shot3{0%,19%{opacity:0;stroke-dashoffset:680}20%{opacity:1}24%{opacity:1;stroke-dashoffset:0}25%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes shot4{0%,27%{opacity:0;stroke-dashoffset:680}28%{opacity:1}32%{opacity:1;stroke-dashoffset:0}33%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes shot5{0%,35%{opacity:0;stroke-dashoffset:680}36%{opacity:1}40%{opacity:1;stroke-dashoffset:0}41%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes shot6{0%,43%{opacity:0;stroke-dashoffset:680}44%{opacity:1}48%{opacity:1;stroke-dashoffset:0}49%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes shot7{0%,51%{opacity:0;stroke-dashoffset:680}52%{opacity:1}56%{opacity:1;stroke-dashoffset:0}57%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes shot8{0%,59%{opacity:0;stroke-dashoffset:680}60%{opacity:1}64%{opacity:1;stroke-dashoffset:0}65%,100%{opacity:0;stroke-dashoffset:0}}

    .t1{animation:t1 18s infinite}.t2{animation:t2 18s infinite}.t3{animation:t3 18s infinite}.t4{animation:t4 18s infinite}
    .t5{animation:t5 18s infinite}.t6{animation:t6 18s infinite}.t7{animation:t7 18s infinite}.t8{animation:t8 18s infinite}
    @keyframes t1{0%,7%{transform:none;opacity:1;fill:#36D876}8%{fill:#FF7A00}9%,76%{transform:translateY(72px) rotate(24deg);opacity:0;fill:#173247}77%,100%{transform:none;opacity:1;fill:#36D876}}
    @keyframes t2{0%,15%{transform:none;opacity:1;fill:#36D876}16%{fill:#FF7A00}17%,76%{transform:translateY(72px) rotate(-24deg);opacity:0;fill:#173247}77%,100%{transform:none;opacity:1;fill:#36D876}}
    @keyframes t3{0%,23%{transform:none;opacity:1;fill:#36D876}24%{fill:#FF7A00}25%,76%{transform:translateY(72px) rotate(24deg);opacity:0;fill:#173247}77%,100%{transform:none;opacity:1;fill:#36D876}}
    @keyframes t4{0%,31%{transform:none;opacity:1;fill:#36D876}32%{fill:#FF7A00}33%,76%{transform:translateY(72px) rotate(-24deg);opacity:0;fill:#173247}77%,100%{transform:none;opacity:1;fill:#36D876}}
    @keyframes t5{0%,39%{transform:none;opacity:1;fill:#36D876}40%{fill:#FF7A00}41%,76%{transform:translateY(72px) rotate(24deg);opacity:0;fill:#173247}77%,100%{transform:none;opacity:1;fill:#36D876}}
    @keyframes t6{0%,47%{transform:none;opacity:1;fill:#36D876}48%{fill:#FF7A00}49%,76%{transform:translateY(72px) rotate(-24deg);opacity:0;fill:#173247}77%,100%{transform:none;opacity:1;fill:#36D876}}
    @keyframes t7{0%,55%{transform:none;opacity:1;fill:#36D876}56%{fill:#FF7A00}57%,76%{transform:translateY(72px) rotate(24deg);opacity:0;fill:#173247}77%,100%{transform:none;opacity:1;fill:#36D876}}
    @keyframes t8{0%,63%{transform:none;opacity:1;fill:#36D876}64%{fill:#FF7A00}65%,76%{transform:translateY(72px) rotate(-24deg);opacity:0;fill:#173247}77%,100%{transform:none;opacity:1;fill:#36D876}}

    .target{stroke:#B8FFE0;stroke-width:1.7;transform-box:fill-box;transform-origin:center}
    .draw{animation:draw 2s ease-in-out infinite}
    @keyframes draw{0%,100%{transform:translateX(0)}50%{transform:translateX(-9px)}}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .complete{animation:complete 18s infinite}
    @keyframes complete{0%,65%{opacity:0}66%,76%{opacity:1}77%,100%{opacity:0}}
    .ready{animation:ready 18s infinite}
    @keyframes ready{0%,64%{opacity:1}65%,76%{opacity:0}77%,100%{opacity:1}}
  </style>
</defs>

<rect width="1400" height="520" rx="34" fill="url(#bg)"/>
